# Proxy / Bastion Server
[proxyserver]
54.241.79.100 ansible_user=ec2-user ansible_ssh_private_key_file=/home/ec2-user/cal-server.pem

# Application Server
[appserver]
10.0.18.53 ansible_user=ec2-user ansible_ssh_private_key_file=/home/ec2-user/cal-server.pem

# Database Server
[dbserver]
10.0.43.164 ansible_user=ec2-user ansible_ssh_private_key_file=/home/ec2-user/cal-server.pem ansible_python_interpreter=/usr/bin/python3

# Grouping private servers
[private:children]
appserver
dbserver

# SSH through Proxy (Bastion)
[private:vars]
ansible_ssh_common_args=-o ProxyCommand="ssh -i /home/ec2-user/cal-server.pem -W %h:%p ec2-user@54.241.79.100"
